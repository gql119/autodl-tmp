experiment:
  dataset: voc
  target_class_name: person
  target_class_id: 14
  poisoning_ratio: 1.0
  eps: 0.062745098
  steps: [24]
  seeds: [0, 1, 2]
  num_classes: 20
  reference_target_map50: 0.81
  reference_non_target_map50: 0.78

data:
  dataset_root: /data/guoqinglong/datasets/VOC_0712_Kaggle_Ready
  train_images: images/train
  train_labels: labels/train
  val_images: images/val
  val_labels: labels/val
  instance_mask_dir: ""
  allow_pseudo_mask_fallback: false

platform:
  mode: cloud
  run_root: /project/guoqinglong/projects/legacy_kproto_ret_dev_20260923/b2_adaptive_dev_20260926/runs_b2
  resume: false
  zip_after_stage: false
  save_every_n_images: 50
  save_every_n_epochs: 10
  pack_every_n_epochs: 10
  debug: false

surrogate:
  model: yolov8n
  ckpt: /project/guoqinglong/projects/legacy_kproto_ret_dev_20260923/checkpoints/voc20_surrogate.pt
  num_classes: 20
  imgsz: 640
  eot_samples: 4

victim:
  model: yolov8n
  init: configs/voc_yolov8n_20cls.yaml
  cache: true
  amp: true
  epochs: 200
  imgsz: 640
  batch: 36
  workers: 16
  optimizer: SGD
  cos_lr: true
  close_mosaic: 100
  save_period: 10
  device: "0"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

methods:
  em_bbox:
    support_type: bbox
    step_size: 0.007843137
    noise_scale: 1.0

  em_mask:
    support_type: mask
    step_size: 0.007843137
    noise_scale: 1.0

  rem_mask:
    support_type: mask
    step_size: 0.007843137
    noise_scale: 1.0
    eot_samples: 4

  tausb_mask:
    support_type: mask
    ring_width: 4

    use_prebaked_instance_mask: true
    strict_instance_mask: false

    shortcut_num_bases: 16
    suppress_small_size: 32
    enable_adaptive_freq_basis: true
    freq_candidate_num_bases: 64
    freq_active_num_bases: 16
    adaptive_freq_warmup_epochs: 5
    adaptive_freq_explore_mode: round_robin
    adaptive_freq_select_metric: grad_norm
    adaptive_freq_update_once: true
    freq_basis_seed: 0

    align_alpha: 0.5
    align_beta: 6.0
    assignment_topk: 100

    freq_amp_buffer: 1.0
    supp_amp_buffer: 1.0
    tanh_temp: 1.0

    lambda_tsvc: 20.0
    lambda_sem: 5.0
    lambda_preserve: 4.0
    lambda_tv: 0.0001
    lambda_budget: 0.0

    alce:
      enabled: true

      lambda_ent: 16.5
      lambda_anchor: 5.0
      lambda_flat: 2.4
      entangle_tau: 0.1

      pag_layer_ratios: [0.7, 0.6, 0.4]
      pag_min_pos: [8, 6, 4]

      use_adaptive_context: true
      rlcp_core_scale: 0.8
      rlcp_trim_ratio: 0.1
      rlcp_adaptive_alpha: 0.15
      rlcp_adaptive_beta: 0.35

      # bounded adaptive RLCP
      rlcp_adaptive_inner_min: 8.0
      rlcp_adaptive_inner_max: 16.0
      rlcp_adaptive_outer_min: 24.0
      rlcp_adaptive_outer_max: 36.0
      rlcp_adaptive_min_gap: 8.0

      min_conf_pixels: 0.0

      lambda_preserve: 3.5
      lambda_preserve_feat: 0.5
      lambda_preserve_logits: 0.8
      lambda_margin: 0.6

    universal_epochs: 40
    universal_batch_size: 16
    eot_samples: 2
    jnd_floor: 0.4
    jnd_ceiling: 1.0
    universal_lr_fourier: 0.05
    universal_lr_suppress: 0.002

  legacy_kproto_ret:
    support_type: mask
    ring_width: 4
    support_mode: bbox_half_overlap
    use_prebaked_instance_mask: false
    strict_instance_mask: false
    shortcut_num_bases: 16
    suppress_small_size: 32
    enable_adaptive_freq_basis: true
    freq_candidate_num_bases: 64
    freq_active_num_bases: 16
    adaptive_freq_warmup_epochs: 5
    freq_basis_seed: 0
    lambda_tv: 0.0001
    lambda_budget: 0.0
    universal_epochs: 24
    universal_batch_size: 16
    eot_samples: 2
    jnd_floor: 0.4
    jnd_ceiling: 1.0
    universal_lr_fourier: 0.05
    kproto:
      num_prototypes: 8
      feature_layer: model.15
      margin: 0.2
      seed: 0
      context_inner: 12
      context_outer: 28
      prototype_cache: ""
      max_images: 0
      max_steps: 0
    loss:
      lambda_bg: 1.0
      lambda_rel: 1.0
      lambda_ret: 0.25
    adaptive:
      enabled: true
      inner_steps: 1
      inner_lr: 0.0001
      batch_size: 1
      lambda_adapt: 1.0
      lambda_nt: 0.25
