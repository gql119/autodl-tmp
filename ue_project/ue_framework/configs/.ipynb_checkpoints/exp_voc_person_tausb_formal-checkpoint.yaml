experiment:
  dataset: voc
  target_class_name: person
  target_class_id: 14
  poisoning_ratio: 1.0
  eps: 0.062745098
  steps: [40]
  seeds: [0, 1, 2]
  num_classes: 20
  reference_target_map50: 0.81
  reference_non_target_map50: 0.78

data:
  dataset_root: /root/autodl-tmp/ue_project/VOC_0712_Kaggle_Ready
  train_images: images/train
  train_labels: labels/train
  val_images: images/val
  val_labels: labels/val
  instance_mask_dir: /root/autodl-tmp/ue_project/VOC_0712_Kaggle_Ready/taus_masks
  allow_pseudo_mask_fallback: true

platform:
  mode: cloud
  run_root: /root/autodl-tmp/ue_project/runs
  resume: false
  zip_after_stage: false
  save_every_n_images: 50
  save_every_n_epochs: 10
  pack_every_n_epochs: 10
  debug: false

surrogate:
  model: yolov8n
  ckpt: /root/autodl-tmp/ue_project/checkpoints/voc20_surrogate.pt
  num_classes: 20
  imgsz: 640
  eot_samples: 4

victim:
  model: yolov8n
  init: configs/voc_yolov8n_20cls.yaml
  cache: true
  amp: true
  epochs: 200
  imgsz: 640
  batch: 36
  workers: 16
  optimizer: SGD
  cos_lr: true
  close_mosaic: 100
  save_period: 10
  device: "0"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

methods:
  em_bbox:
    support_type: bbox
    step_size: 0.007843137
    noise_scale: 1.0

  em_mask:
    support_type: mask
    step_size: 0.007843137
    noise_scale: 1.0

  rem_mask:
    support_type: mask
    step_size: 0.007843137
    noise_scale: 1.0
    eot_samples: 4

  tausb_mask:
    support_type: mask
    ring_width: 4
    
    # 新增：优先使用离线实例级 mask
    use_prebaked_instance_mask: true

    # 新增：第一轮建议 false。等确认没问题后，可以改 true 做严格实验
    strict_instance_mask: false
    
    # ====================================================
    # 🚀 1. 武器库容量 (Weaponry Capacity)
    # ====================================================
    # 既然有了梯度的绝对阻断和掩码的极致抠图，我们可以放心释放容量
    shortcut_num_bases: 16       # 满载 16 组基底，编织高频类条件水印
    suppress_small_size: 32
    
    align_alpha: 0.5
    align_beta: 6.0
    assignment_topk: 100

    freq_amp_buffer: 1.0
    supp_amp_buffer: 1.0
    tanh_temp: 1.0

    # ====================================================
    # 🚨 2. 核心损失权重 (课程学习的最大目标值)
    # ====================================================
    lambda_induce: 30.0          # 四维主炮的基准缩放系数
    
    # 【防线基石】保护权重必须拉高！
    # 因为主炮太猛，我们需要强大的拉力维持非目标特征。
    # 代码中前 15 轮会乘以 0.3 (即实际权重 3.0)，后期拉满到 10.0。
    lambda_preserve: 10.0        
    
    lambda_shape: 5.0            # 第 25 轮之后开始发力，彻底粉碎深层语义
    enable_shape_entanglement: True
    
    lambda_cls_aux: 0.0          
    
    # 【核心防御】极低的 TV 损失！
    # 绝不能让 TV 惩罚把我们用 Tanh 辛苦拉出来的“硬边缘”给磨平了
    lambda_tv: 0.0001            
    lambda_budget: 0.0           

    # ====================================================
    # ⚙️ 3. 运行环境与能量释放
    # ====================================================
    universal_epochs: 40
    
    # 【防 OOM 设定】16 组基底 + 多层 Hook 极其吃显存。
    # 如果你的显卡 (如 4090/A100) 报 OOM，请降至 12 或 8。
    universal_batch_size: 32
    
    eot_samples: 2               # 配合代码中的 EG-style Dropout
    
    # 【能量地板】
    # 初始为 0.3，配合代码中的动态拉升（后期会到 0.5）。
    # 允许在平滑区域（如人脸、衣服）注入足够的对抗能量。
    jnd_floor: 0.3               
    jnd_ceiling: 1.0
    
    # 配合 16 组基底的最佳探索步长，防止优化器跑飞
    universal_lr_fourier: 0.05   
    universal_lr_suppress: 0.002