experiment:
  dataset: voc
  target_class_name: person
  target_class_id: 14
  poisoning_ratio: 1.0
  eps: 0.062745098
  steps: [40]
  seeds: [0, 1, 2]
  num_classes: 20
  reference_target_map50: 0.81
  reference_non_target_map50: 0.78

data:
  dataset_root: /root/autodl-tmp/ue_project/VOC_0712_Kaggle_Ready
  train_images: images/train
  train_labels: labels/train
  val_images: images/val
  val_labels: labels/val
  instance_mask_dir: /root/autodl-tmp/ue_project/VOC_0712_Kaggle_Ready/taus_masks
  allow_pseudo_mask_fallback: true

platform:
  mode: cloud
  run_root: /root/autodl-tmp/ue_project/runs
  resume: false
  zip_after_stage: false
  save_every_n_images: 50
  save_every_n_epochs: 10
  pack_every_n_epochs: 10
  debug: false

surrogate:
  model: yolov8n
  ckpt: /root/autodl-tmp/ue_project/checkpoints/voc20_surrogate.pt
  num_classes: 20
  imgsz: 640
  eot_samples: 4

victim:
  model: yolov8n
  init: configs/voc_yolov8n_20cls.yaml
  cache: true
  amp: true
  epochs: 200
  imgsz: 640
  batch: 36
  workers: 16
  optimizer: SGD
  cos_lr: true
  close_mosaic: 100
  save_period: 10
  device: "0"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

methods:
  em_bbox:
    support_type: bbox
    step_size: 0.007843137
    noise_scale: 1.0

  em_mask:
    support_type: mask
    step_size: 0.007843137
    noise_scale: 1.0

  rem_mask:
    support_type: mask
    step_size: 0.007843137
    noise_scale: 1.0
    eot_samples: 4

  tausb_mask:
    support_type: mask
    ring_width: 4
    
    # 新增：优先使用离线实例级 mask
    use_prebaked_instance_mask: true

    # 新增：第一轮建议 false。等确认没问题后，可以改 true 做严格实验
    strict_instance_mask: false
    
    # ====================================================
    # 🚀 1. 武器库容量 (Weaponry Capacity)
    # ====================================================
    # 既然有了梯度的绝对阻断和掩码的极致抠图，我们可以放心释放容量
    shortcut_num_bases: 16       # 满载 16 组基底，编织高频类条件水印
    suppress_small_size: 32
    
    align_alpha: 0.5
    align_beta: 6.0
    assignment_topk: 100

    freq_amp_buffer: 1.0
    supp_amp_buffer: 1.0
    tanh_temp: 1.0

    # ====================================================
    # 🚨 2. 核心损失权重 (TSVC-DA 新引擎)
    # ====================================================
    # 删除废弃的 lambda_induce, lambda_shape, lambda_cls_aux
    
    # 【核心 A】空间方差坍缩权重 (Collapse)
    # 负责压平目标区域的空间起伏，致盲定位。建议在 10.0 - 20.0 之间调整。
    lambda_tsvc: 20.0       
    
    # 【核心 B】双重语义锚定权重 (Semantic Anchor)
    # 负责死死拉住均值向量的余弦方向和 L2 范数，存活分类。
    lambda_sem: 5.0         
    
    # 【防线基石】非目标区域保护权重
    # 由于现在的 TSVC 专注于深层特征空间，10.0 可能会产生过强的拉扯，建议先降至 5.0 观察。
    lambda_preserve: 4.0    
    
    # 【核心防御】极低的 TV 损失！
    lambda_tv: 0.0001            
    lambda_budget: 0.0 

    # ALSD / ACGT / ALCE (default main path)
    alce:
      enabled: true
      
      # 【主引擎】特征纠缠与空间坍缩权重
      lambda_ent: 15.0
      lambda_anchor: 5.0
      lambda_flat: 2.2
      entangle_tau: 0.1
      
      # 🚑 降低纯净背景面积门槛，防止拥挤场景全军覆没
      min_conf_pixels: 5.0
      # --------------------------------------------------
      # [新机制 1] PAG (Percentile Assignment Gate)
      # --------------------------------------------------
      pag_top_ratio: 0.50     # 核心：精准狙击得分前 30% 的高能神经元
      pag_min_pos: 8          # 兜底：如果 Anchor 数量少于 8，退回全量攻击防漏掉小目标

      # --------------------------------------------------
      # [新机制 2] RLCP (Robust Local Context Prototype)
      # --------------------------------------------------
      rlcp_core_scale: 0.8    # 核心：屏蔽非目标物体时，收缩 20% 边缘，释放上下文空间
      rlcp_trim_ratio: 0.1    # 核心：提取背景原型时，掐头去尾剔除 10% 的极值防污染

      # --------------------------------------------------
      # [新机制 3] DSNP-lite (Dual-Structure Non-target Preserve)
      # --------------------------------------------------
      lambda_preserve: 4.0          # 总保护权重外部缩放系数
      lambda_preserve_feat: 0.5     # [防线A] 特征空间 MSE 保护
      lambda_preserve_logits: 1.0   # [防线B] 分类 Logits MSE 保护
      lambda_margin: 1.0            # 核心：[防线C] Top1-Top2 决策边界 Margin 强力锁定
    # ====================================================
    # ⚙️ 3. 运行环境与能量释放
    # ====================================================
    universal_epochs: 40
    
    # 【防 OOM 设定】16 组基底 + 多层 Hook 极其吃显存。
    # 如果你的显卡 (如 4090/A100) 报 OOM，请降至 12 或 8。
    universal_batch_size: 16
    
    eot_samples: 2               # 配合代码中的 EG-style Dropout
    
    # 【能量地板】
    # 初始为 0.3，配合代码中的动态拉升（后期会到 0.5）。
    # 允许在平滑区域（如人脸、衣服）注入足够的对抗能量。
    jnd_floor: 0.4               
    jnd_ceiling: 1.0
    
    # 配合 16 组基底的最佳探索步长，防止优化器跑飞
    universal_lr_fourier: 0.05   
    universal_lr_suppress: 0.002
