experiment:
  dataset: voc
  target_class_name: person
  target_class_id: 14
  poisoning_ratio: 1.0
  eps: 0.062745098
  steps: [40]
  seeds: [0, 1, 2]
  num_classes: 20
  reference_target_map50: 0.81
  reference_non_target_map50: 0.78

data:
  dataset_root: /root/autodl-tmp/ue_project/VOC_0712_Kaggle_Ready
  train_images: images/train
  train_labels: labels/train
  val_images: images/val
  val_labels: labels/val
  instance_mask_dir: /root/autodl-tmp/ue_project/VOC_0712_Kaggle_Ready/taus_masks
  allow_pseudo_mask_fallback: true

platform:
  mode: cloud
  run_root: /root/autodl-tmp/ue_project/runs
  resume: false
  zip_after_stage: false
  save_every_n_images: 50
  save_every_n_epochs: 10
  pack_every_n_epochs: 10
  debug: false

surrogate:
  model: yolov8n
  ckpt: /root/autodl-tmp/ue_project/checkpoints/voc20_surrogate.pt
  num_classes: 20
  imgsz: 640
  eot_samples: 4

victim:
  model: yolov8n
  init: configs/voc_yolov8n_20cls.yaml
  cache: true
  amp: true
  epochs: 200
  imgsz: 640
  batch: 36
  workers: 16
  optimizer: SGD
  cos_lr: true
  close_mosaic: 100
  save_period: 10
  device: "0"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

methods:
  em_bbox:
    support_type: bbox
    step_size: 0.007843137
    noise_scale: 1.0

  em_mask:
    support_type: mask
    step_size: 0.007843137
    noise_scale: 1.0

  rem_mask:
    support_type: mask
    step_size: 0.007843137
    noise_scale: 1.0
    eot_samples: 4

  tausb_mask:
    support_type: mask
    ring_width: 4

    use_prebaked_instance_mask: true
    strict_instance_mask: false

    legacy_best_reproduce_mode: true
    force_pseudo_mask_fallback: true

    enable_mild_non_target_filtering: false
    enable_weighted_ring: false
    enable_frozen_assignment_context_bridge: false
    enable_dual_carrier_fdacb: false
    enable_detector_effective_support: false
    enable_shortcut_prototype_alce: false
    enable_sample_level_nt_risk_filter: false
    enable_sample_level_nt_risk_weight: false

    phase0_diagnostics_only: true
    phase0_max_epochs: 5
    save_phase0_probe_only: true

    shortcut_num_bases: 16
    suppress_small_size: 32

    enable_adaptive_freq_basis: true
    enable_band_aware_freq_basis: true
    freq_candidate_num_bases: 64
    freq_active_num_bases: 16
    freq_band_names: ["low", "mid", "high"]
    freq_band_candidate_nums: [16, 32, 16]
    freq_band_active_nums: [1, 13, 2]
    freq_band_radius_ranges:
      low: [2, 8]
      mid: [8, 24]
      high: [24, 48]
    freq_band_adaptive_quota: false
    freq_band_active_min: [0, 12, 1]
    freq_band_active_max: [3, 16, 4]

    adaptive_freq_warmup_epochs: 5
    adaptive_freq_explore_mode: band_round_robin
    adaptive_freq_select_metric: attack_collateral_ratio
    adaptive_freq_update_once: true
    freq_basis_seed: 0
    freq_score_eps: 1.0e-6
    freq_score_min_attack_grad: 1.0e-7
    freq_score_use_logits_collateral: true
    freq_score_use_feat_collateral: false
    freq_score_use_margin_collateral: false
    freq_score_attack_use_weighted_loss: true
    freq_score_collateral_use_weighted_loss: true

    enable_cooccur_nt_logits_preserve: true
    cooccur_nt_loss_type: prob_drop_hinge
    cooccur_nt_logits_lambda: 1.0
    cooccur_nt_drop_tolerance: 0.005
    cooccur_nt_hard_top_ratio: 0.5
    cooccur_nt_min_hard_count: 16
    cooccur_nt_use_positive_drop_only: true
    cooccur_nt_min_clean_conf: 0.15
    cooccur_nt_only_on_real_fg: true
    cooccur_nt_assigned_class_only: true
    cooccur_nt_exclude_target_class: true
    cooccur_nt_warmup_start_epoch: 5
    cooccur_nt_warmup_end_epoch: 20
    cooccur_nt_apply_after_freq_selection: true
    cooccur_nt_do_not_use_for_freq_score: true

    align_alpha: 0.5
    align_beta: 6.0
    assignment_topk: 100

    freq_amp_buffer: 1.0
    supp_amp_buffer: 1.0
    tanh_temp: 1.0

    lambda_tsvc: 20.0
    lambda_sem: 5.0
    lambda_preserve: 4.0
    lambda_tv: 0.0001
    lambda_budget: 0.0

    alce:
      enabled: true

      lambda_ent: 16.5
      lambda_anchor: 5.0
      lambda_flat: 2.4
      entangle_tau: 0.1

      pag_layer_ratios: [0.7, 0.6, 0.4]
      pag_min_pos: [8, 6, 4]

      use_adaptive_context: true
      rlcp_core_scale: 0.8
      rlcp_trim_ratio: 0.1
      rlcp_adaptive_alpha: 0.15
      rlcp_adaptive_beta: 0.35

      rlcp_adaptive_inner_min: 8.0
      rlcp_adaptive_inner_max: 16.0
      rlcp_adaptive_outer_min: 24.0
      rlcp_adaptive_outer_max: 36.0
      rlcp_adaptive_min_gap: 8.0

      min_conf_pixels: 0.0

      lambda_preserve: 3.5
      lambda_preserve_feat: 0.5
      lambda_preserve_logits: 0.8
      lambda_margin: 0.6

    universal_epochs: 40
    universal_batch_size: 16
    eot_samples: 2
    jnd_floor: 0.4
    jnd_ceiling: 1.0
    universal_lr_fourier: 0.05
    universal_lr_suppress: 0.002

