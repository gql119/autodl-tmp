method: short_horizon_feasibility

protected_class_id: 14
authorized_class_ids: auto
num_classes: 20

paths:
  voc_root: outputs/local_validation/voc_raw/VOCdevkit/VOC2007
  checkpoint: checkpoints/voc20_surrogate.pt

checkpoint_screening:
  checkpoint_candidates:
    - name: late_voc20_surrogate
      path: checkpoints/voc20_surrogate.pt
      epoch: unknown
      role: late
    - name: skipped_yolo26n_unknown_class_space
      path: yolo26n.pt
      epoch: unknown
      role: skipped_non_voc20
  rollout_steps: [1, 3, 5]
  trajectories: 30
  valid_ratio_required: 0.80

support:
  use_p0_localized_support: true
  exclude_authorized_core: true
  exclude_ambiguous: true
  enforce_zero_outside_support: true
  dilation_pixels: 0
  expansion_ratio: 0.0
  authorized_core_scale: 1.0
  ambiguous_iou_threshold: 0.5

rollout:
  steps: 3
  parameter_scope: head
  optimizer: functional_sgd
  learning_rate: 1.0e-4
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false
  dynamic_assignment: true
  clean_reference_detached: true

learning_gain:
  protected_margin: 0.10
  protected_clean_gain_min: 1.0e-4
  gain_denominator_floor: 1.0e-4

objective:
  lambda_protected_gain: 1.0
  lambda_authorized_gain: 1.0
  lambda_shared_gain: 1.0
  lambda_regularization: 1.0

clean_clean:
  pairs: 50
  threshold_quantile: 90
  kappa_t_values: [1.0, 2.0]
  kappa_t: 2.0

constraints:
  mu_authorized_init: 1.0
  mu_shared_init: 1.0
  dual_learning_rate: 0.1
  mu_max: 100.0
  lambda_regularization: 1.0

trajectory_sampling:
  support_steps: 3
  recent_image_exclusion_window: 20
  max_sampling_attempts: 30
  heldout_trajectories: 30
  train_pool_batches: 180

optimization:
  outer_steps: 30
  evaluation_interval: 5
  delta_learning_rate: 0.01
  eps: 0.062745098
  imgsz: 160
  batch_size: 1

victim_smoke:
  enabled_if_constraints_feasible: true
  minimum_candidates: 6
  seed: 0
